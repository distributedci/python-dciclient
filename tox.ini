[tox]
skipsdist = True
envlist = pep8,py3,vault,vault-legacy

[testenv]
basepython = python3.12
deps = -e {toxinidir}
       -r {toxinidir}/requirements.txt
       -r {toxinidir}/test-requirements.txt
install_command = pip install -U {packages}
passenv= *
allowlist_externals =
    sh
commands =
    sh ./start_db.sh

[testenv:py3]
commands =
    {[testenv]commands}
    py.test -v {posargs}

[testenv:vault]
deps = -e {toxinidir}
       -r {toxinidir}/requirements.txt
       ansible
commands = sh ./tests/test-vault.sh

[testenv:vault-legacy]
basepython = python3.9
deps = -e {toxinidir}
       -r {toxinidir}/requirements.txt
       ansible==2.9.27
commands = sh ./tests/test-vault.sh

[testenv:pep8]
skip_install = true
deps = flake8
commands =
    flake8

[flake8]
max-line-length = 88
ignore = H405,H304,H104,E402,E129,E722,E501,W605,W504,W503
exclude=venv,.venv,.git,.tox,dist,*egg,*.egg-info,build,examples,docs
show-source = True
